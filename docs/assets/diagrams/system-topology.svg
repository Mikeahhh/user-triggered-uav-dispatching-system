<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">System topology</title>
  <desc id="desc">Three components share one operator-confirmed search workflow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>
  <text x="40" y="49" font-family="Times New Roman, Times, serif" font-size="26" font-weight="400" fill="#000000">System topology</text>
  <text x="40" y="80" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Three components share one operator-confirmed search workflow.</text>
  <text x="60" y="149" font-family="Times New Roman, Times, serif" font-size="15" font-weight="400" fill="#000000">01 · HIKER</text>
  <text x="60" y="181" font-family="Times New Roman, Times, serif" font-size="22" font-weight="700" fill="#000000">Android application</text>
  <text x="60" y="213" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Event Booking · planned route</text>
  <text x="60" y="238" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Quick Start · timestamped GPS</text>
  <text x="60" y="263" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">SOS · request and position</text>
  <text x="430" y="149" font-family="Times New Roman, Times, serif" font-size="15" font-weight="400" fill="#000000">SHARED RECORDS</text>
  <text x="430" y="181" font-family="Times New Roman, Times, serif" font-size="22" font-weight="700" fill="#000000">Realtime Database</text>
  <text x="430" y="213" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Bookings, GPS history and SOS</text>
  <text x="430" y="238" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Alerts and confirmed events</text>
  <text x="430" y="263" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Read by the ground station</text>
  <text x="800" y="149" font-family="Times New Roman, Times, serif" font-size="15" font-weight="400" fill="#000000">02 · OPERATOR</text>
  <text x="800" y="181" font-family="Times New Roman, Times, serif" font-size="22" font-weight="700" fill="#000000">Ground station</text>
  <text x="800" y="213" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Contact and verify</text>
  <text x="800" y="238" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Confirm event and review route</text>
  <text x="800" y="263" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Confirm dispatch</text>
  <path d="M 340 210 L 408 210" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow)" />
  <path d="M 710 210 L 778 210" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow)" />
  <path d="M 930 307 L 930 338 L 560 338 L 560 371" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow)" />
  <text x="800" y="402" font-family="Times New Roman, Times, serif" font-size="15" font-weight="400" fill="#000000">03 · ONBOARD</text>
  <text x="800" y="434" font-family="Times New Roman, Times, serif" font-size="22" font-weight="700" fill="#000000">Search UAV</text>
  <text x="800" y="466" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Admit and persist the mission</text>
  <text x="800" y="491" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Fly ordered targets and return</text>
  <text x="800" y="516" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Request landing; report status</text>
  <text x="430" y="402" font-family="Times New Roman, Times, serif" font-size="15" font-weight="400" fill="#000000">TRANSPORT</text>
  <text x="430" y="434" font-family="Times New Roman, Times, serif" font-size="22" font-weight="700" fill="#000000">Wi-Fi communication</text>
  <text x="430" y="466" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Mission transfer and admission</text>
  <text x="430" y="491" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Execution status</text>
  <text x="430" y="516" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Record delivery and matching ACK</text>
  <path d="M 780 465 L 712 465" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow)" />
  <path d="M 710 435 L 778 435" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow)" />
  <path d="M 710 400 L 745 400 L 745 270 L 778 270" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow)" stroke-dasharray="7 6" />
  <text x="60" y="402" font-family="Times New Roman, Times, serif" font-size="15" font-weight="400" fill="#000000">OPTIONAL LOCAL COLLECTION</text>
  <text x="60" y="434" font-family="Times New Roman, Times, serif" font-size="22" font-weight="700" fill="#000000">Phone record receiver</text>
  <text x="60" y="466" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Phone → onboard HTTP receiver</text>
  <text x="60" y="491" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Persist the received record</text>
  <text x="60" y="516" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Forward after the execution gate</text>
  <path d="M 190 307 L 190 371" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow)" stroke-dasharray="7 6" />
  <path d="M 340 465 L 408 465" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow)" />
  <text x="40" y="615" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Operator confirmation applies to all three modes; an SOS request alone does not dispatch a UAV.</text>
  <text x="40" y="676" font-family="Times New Roman, Times, serif" font-size="16" font-weight="400" fill="#000000">Solid arrows: primary exchanges. Dashed arrows: return status or optional local collection path.</text>
</svg>
