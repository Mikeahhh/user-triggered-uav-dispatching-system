<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="645" viewBox="0 0 1120 645" role="img" aria-labelledby="title desc">
  <title id="title">Mobile application architecture</title>
  <desc id="desc">Android keeps sampling and pending synchronization separate from screen navigation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff" />
  <text x="40" y="49" font-family="Times New Roman, Times, serif" font-size="26" font-weight="400" fill="#000000">Mobile application architecture</text>
  <text x="40" y="80" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Android keeps sampling and pending synchronization separate from screen navigation.</text>
  <text x="60" y="151" font-family="Times New Roman, Times, serif" font-size="15" font-weight="400" fill="#000000">PRESENTATION</text>
  <text x="60" y="183" font-family="Times New Roman, Times, serif" font-size="22" font-weight="700" fill="#000000">React Native screens</text>
  <text x="60" y="215" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Booking · Quick Start · SOS</text>
  <text x="60" y="240" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Map · profile · settings</text>
  <text x="60" y="265" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">English and Chinese interfaces</text>
  <text x="420" y="151" font-family="Times New Roman, Times, serif" font-size="15" font-weight="400" fill="#000000">APPLICATION SERVICES</text>
  <text x="420" y="183" font-family="Times New Roman, Times, serif" font-size="22" font-weight="700" fill="#000000">TypeScript services</text>
  <text x="420" y="215" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Booking-time estimate</text>
  <text x="420" y="240" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Native tracking bridge</text>
  <text x="420" y="265" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Phone-to-UAV clients</text>
  <text x="780" y="151" font-family="Times New Roman, Times, serif" font-size="15" font-weight="400" fill="#000000">DURABLE STATE</text>
  <text x="780" y="183" font-family="Times New Roman, Times, serif" font-size="22" font-weight="700" fill="#000000">Android SQLite</text>
  <text x="780" y="215" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Original sample timestamps</text>
  <text x="780" y="240" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Session identity and sequence</text>
  <text x="780" y="265" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Pending cloud operations</text>
  <path d="M 360 210 L 398 210" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow)" />
  <path d="M 720 210 L 758 210" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow)" />
  <text x="60" y="397" font-family="Times New Roman, Times, serif" font-size="15" font-weight="400" fill="#000000">ACQUISITION</text>
  <text x="60" y="429" font-family="Times New Roman, Times, serif" font-size="22" font-weight="700" fill="#000000">Location foreground service</text>
  <text x="60" y="461" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">TrackingService + TrackingCore</text>
  <text x="60" y="486" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Valid fixes enter one transaction</text>
  <text x="60" y="511" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Five-second requested interval</text>
  <text x="420" y="397" font-family="Times New Roman, Times, serif" font-size="15" font-weight="400" fill="#000000">SYNCHRONIZATION</text>
  <text x="420" y="429" font-family="Times New Roman, Times, serif" font-size="22" font-weight="700" fill="#000000">Persistent upload worker</text>
  <text x="420" y="461" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">TrackingSync + REST transport</text>
  <text x="420" y="486" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Retry the same saved operation</text>
  <text x="420" y="511" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Foreground service / JobScheduler</text>
  <text x="780" y="397" font-family="Times New Roman, Times, serif" font-size="15" font-weight="400" fill="#000000">EXTERNAL INTERFACES</text>
  <text x="780" y="429" font-family="Times New Roman, Times, serif" font-size="22" font-weight="700" fill="#000000">Database and UAV</text>
  <text x="780" y="461" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Cloud records → ground station</text>
  <text x="780" y="486" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Local HTTP → onboard receiver</text>
  <text x="780" y="511" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">Delivery state remains visible</text>
  <path d="M 200 368 L 200 333 L 920 333 L 920 299" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow)" />
  <path d="M 920 299 L 920 345 L 560 345 L 560 366" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow)" stroke-dasharray="7 6" />
  <path d="M 720 450 L 758 450" fill="none" stroke="#000000" stroke-width="1.25" stroke-linejoin="miter" marker-end="url(#arrow)" />
  <text x="40" y="591" font-family="Times New Roman, Times, serif" font-size="18" font-weight="400" fill="#000000">A local save preserves the record; cloud acknowledgement is tracked independently.</text>
</svg>
