per_listener_settings true

# The mission bridge connects locally without MQTT credentials.
listener 1883 127.0.0.1
allow_anonymous true

# Replace the example address with the UAV computer's LAN address.
listener 1883 192.0.2.10
allow_anonymous false
password_file /etc/mosquitto/rescue.passwd
acl_file /etc/mosquitto/rescue.acl


persistence true
persistence_location /var/lib/mosquitto/
